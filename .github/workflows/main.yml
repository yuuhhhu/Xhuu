name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          if [ -f MahmoudVpnPro.zip ]; then
            unzip -q -o MahmoudVpnPro.zip
            cp -a MahmoudVpnPro/. .
            rm -rf MahmoudVpnPro MahmoudVpnPro.zip
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A
            git commit -m "Extract project"
            git push
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MahmoudVpnPro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
