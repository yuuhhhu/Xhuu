name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        shell: bash
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            echo "=========== ERRORS ==========="
            grep -E -B1 -A6 "What went wrong|^e: |error:" build.log | head -40
            echo "=========== LAST 30 LINES ==========="
            tail -30 build.log
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: MahmoudVpnPro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
