name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        shell: bash
        run: |
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -E -A4 "What went wrong|^e: |error:" build.log | head -25 | while IFS= read -r l; do echo "::error::$l"; done
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: MahmoudVpnPro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
