name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          Z=$(find . -maxdepth 1 -iname "*.zip" | head -n 1)
          echo "zip found: $Z"
          if [ -n "$Z" ]; then
            rm -rf /tmp/x && mkdir /tmp/x
            unzip -q -o "$Z" -d /tmp/x
            S=$(find /tmp/x -name settings.gradle.kts | head -n 1)
            D=$(dirname "$S")
            cp -a "$D"/. .
            rm -f "$Z"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A
            git commit -m "Extract project" || true
            git push
          fi
          ls -la
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MahmoudVpnPro-debug-apk
          path: app/build/outputs/apk/debug/*.apk
